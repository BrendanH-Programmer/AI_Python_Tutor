<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Python Tutor</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

<div class="container">
    <h1>AI Python Tutor</h1>

    <textarea id="codeInput" placeholder="Paste your Python code here..."></textarea>

    <button onclick="sendCode()">Analyse Code</button>
    <button onclick="nextHint()">Next Hint</button>

    <div class="output">
        <h3>Response</h3>
        <pre id="responseBox"></pre>
    </div>

    <!-- 🔥 ERROR RANKING TABLE (NEW) -->
    <div class="output">
        <h3>Error Ranking</h3>

        <table id="errorTable">
            <thead>
                <tr>
                    <th>Error Type</th>
                    <th>Priority</th>
                    <th>Message</th>
                </tr>
            </thead>

            <tbody></tbody>
        </table>
    </div>

</div>

<script src="js/app.js"></script>

</body>
</html>
